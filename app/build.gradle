plugins { id 'com.android.application' }

android {
    namespace 'dev.mark.utvremote'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.mark.utvremote'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // CI validates builds with an ephemeral Android debug key; it cannot sign TV updates.
    if (project.findProperty('utv.ci') != 'true') {
        signingConfigs {
            debug {
                storeFile rootProject.file('signing/prototype-debug.keystore')
                storePassword 'android'
                keyAlias 'AndroidDebugKey'
                keyPassword 'android'
            }
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
             'javax.net.ssl.trustStore', 'utv.preview', 'utv.preview.assets',
             'utv.preview.output'].each { name ->
                if (System.getProperty(name) != null) systemProperty name, System.getProperty(name)
            }
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
    implementation 'androidx.core:core:1.17.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
